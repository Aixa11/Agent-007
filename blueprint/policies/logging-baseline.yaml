apiVersion: v1
kind: PolicyBaseline
metadata:
  name: logging-baseline
  version: 1.0.0
  owner: secure-architect-agent
spec:
  purpose: >
    Define a minimal logging baseline that ensures auditability,
    traceability, retention, and security monitoring for critical infrastructure.

  principles:
    - auditability
    - traceability
    - centralization
    - retention
    - tamperResistance
    - leastNoise

  requirements:
    auditLogs:
      enabled: true
      allCriticalActionsLogged: true
      identityEventsLogged: true
      policyChangesLogged: true
      infrastructureChangesLogged: true

    centralization:
      logsForwardedToCentralStore: true
      sourceIsolationPreserved: true
      accessToLogsRestricted: true

    retention:
      minimumRetentionDays: 365
      retentionPolicyDocumented: true
      archivalStrategyDefined: true

    integrity:
      immutableStoragePreferred: true
      accessControlledByRole: true
      deletionRestricted: true

    monitoring:
      alertOnPrivilegeEscalation: true
      alertOnPolicyChanges: true
      alertOnSuspiciousLoginPatterns: true
      alertOnLoggingFailures: true

  controls:
    - id: LOG-001
      name: Central audit trail
      description: Centralize logs for critical activity.
    - id: LOG-002
      name: Retention policy
      description: Preserve logs long enough for review and incident response.
    - id: LOG-003
      name: Access restriction
      description: Restrict access to logs to authorized roles only.
    - id: LOG-004
      name: Change visibility
      description: Log identity, policy, and infrastructure changes.
    - id: LOG-005
      name: Failure detection
      description: Alert when logging pipelines fail or degrade.

  exceptions:
    allowed:
      - shortTermDebugLogging
    rules:
      - Must be time-limited.
      - Must be documented.
      - Must exclude sensitive payloads where possible.
      - Must be removed after use.

  validationHints:
    - Check that logs are centralized.
    - Check that retention is explicitly defined.
    - Check that privileged actions are visible.
    - Check that access to logs is restricted.
    - Check that logging failures generate alerts.